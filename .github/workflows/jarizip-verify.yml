name: Verify real-job integration
on:
  push:
    branches: [verify/jarizip-live-final]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
          JARIZIP_TEST_PORT: '4182'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 2
